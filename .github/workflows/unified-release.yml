name: Official desktop staging build
run-name: "正式 v1.6.1 · 更新入口修复 · 5950e9fc"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-staging-1.6.1
  cancel-in-progress: false

env:
  # Creative workspace exceeds the 2 GiB heap default on macOS runners.
  NODE_OPTIONS: --max-old-space-size=4096
  TUZI_SWITCH_RELEASE_REPOSITORY: tuziapi/tuzi-switch
  VITE_RELEASE_REPOSITORY: tuziapi/tuzi-switch
  OFFICIAL_SOURCE_SHA: 5950e9fc773d2092ed7a630a4ebd3750e9767314

jobs:
  verify:
    if: github.repository == 'AiW520/tuzi-switch'
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tuziapi/tuzi-switch
          ref: 5950e9fc773d2092ed7a630a4ebd3750e9767314
          persist-credentials: false
      - name: Verify pinned official source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFFICIAL_SOURCE_SHA"
      - name: Verify version identity
        id: identity
        env:
          PUBLISH: "false"
        run: node scripts/verify-release-identity.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: '9'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:creative
      - run: pnpm --filter @tuzi/download-page test
      - name: Compile download page before building installers
        run: pnpm --filter @tuzi/download-page exec vite build
      - uses: actions/upload-artifact@v4
        with:
          name: download-page-template
          path: packages/download-page/dist
          if-no-files-found: error
          retention-days: 30
      - run: python3 scripts/test_install_entry.py
      - run: python3 scripts/test_release_assets.py
      - run: node --test scripts/verify-updater-assets.mjs
      - run: pnpm typecheck
      - run: pnpm exec vitest run --maxWorkers=2 --minWorkers=1
      - run: pnpm test:creative
      - run: python3 -m unittest discover -s src-tauri/resources/builtin-skills/codex-image-render-fallback/scripts -p 'test_*.py'

  installers:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tuziapi/tuzi-switch
          ref: 5950e9fc773d2092ed7a630a4ebd3750e9767314
          persist-credentials: false
      - name: Verify pinned official source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFFICIAL_SOURCE_SHA"
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: '9'
      - name: Read repository Rust version
        id: rust-version
        shell: bash
        run: |
          node -e 'const fs = require("fs"); const text = fs.readFileSync("rust-toolchain.toml", "utf8"); const version = text.match(/^channel\s*=\s*"([^"]+)"/m)?.[1]; if (!version) throw new Error("Missing pinned Rust channel"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:renderer
      - name: Native regression (host target)
        shell: bash
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -- --test-threads=1
      - name: Acceptance profile regression
        shell: bash
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --features isolated-profile acceptance_profile_ -- --test-threads=1
      - name: Isolated MCP service regression
        if: runner.os == 'macOS'
        shell: bash
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib native_mcp_service_ -- --ignored --test-threads=1
      - name: Windows real browser activation
        if: runner.os == 'Windows'
        shell: bash
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib windows_real_browser_activation -- --ignored --nocapture --test-threads=1
      - name: Build installers
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: '-'
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          export GITHUB_SHA="$OFFICIAL_SOURCE_SHA"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            RELEASE_CONFIG="$(node scripts/tauri-release-config.cjs --unsigned)"
          else
            RELEASE_CONFIG="$(node scripts/tauri-release-config.cjs --desktop-product-name --unsigned)"
          fi
          pnpm tauri build --target "$BUILD_TARGET" --config "$RELEASE_CONFIG"
      - name: Collect installers and source manifest
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_NAME: ${{ matrix.name }}
        run: |
          python3 <<'PY'
          import hashlib, json, os, pathlib, shutil
          source = pathlib.Path('src-tauri/target') / os.environ['BUILD_TARGET'] / 'release/bundle'
          output = pathlib.Path('release-assets')
          output.mkdir()
          files = []
          for path in sorted(source.rglob('*')):
              if path.is_file() and path.suffix in {'.dmg', '.msi', '.exe', '.AppImage', '.deb', '.rpm'}:
                  target = output / ('tuzi-assistant-' + os.environ['BUILD_NAME'] + path.suffix)
                  if target.exists(): raise SystemExit('Duplicate installer format')
                  shutil.copy2(path, target)
                  files.append({'file': target.name, 'sha256': hashlib.sha256(target.read_bytes()).hexdigest(), 'bytes': target.stat().st_size})
          if not files:
              raise SystemExit('No installers were produced')
          (output / ('manifest-' + os.environ['BUILD_NAME'] + '.json')).write_text(json.dumps({
              'repository': 'tuziapi/tuzi-switch', 'commit': os.environ['OFFICIAL_SOURCE_SHA'],
              'builderRepository': os.environ['GITHUB_REPOSITORY'], 'builderCommit': os.environ['GITHUB_SHA'],
              'updaterSigned': False, 'publicationReady': False,
              'run': os.environ['GITHUB_RUN_ID'], 'target': os.environ['BUILD_TARGET'],
              'version': json.loads(pathlib.Path('package.json').read_text(encoding='utf-8'))['version'],
              'developerSigned': False, 'notarized': False, 'channel': 'stable',
              'applicationId': 'com.tuziswitch.desktop', 'isolatedLocalProfile': False, 'files': files
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Prepare macOS updater archive for later official signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_NAME: ${{ matrix.name }}
        run: |
          python3 <<'PYTHON'
          import os, pathlib, tarfile
          source = pathlib.Path('src-tauri/target') / os.environ['BUILD_TARGET'] / 'release/bundle/macos'
          apps = list(source.glob('*.app'))
          if len(apps) != 1: raise SystemExit('Expected exactly one app bundle')
          output = pathlib.Path('release-assets') / ('tuzi-assistant-' + os.environ['BUILD_NAME'] + '.app.tar.gz')
          with tarfile.open(output, 'w:gz') as archive:
              archive.add(apps[0], arcname=apps[0].name)
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  assemble:
    needs: [verify, installers]
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tuziapi/tuzi-switch
          ref: 5950e9fc773d2092ed7a630a4ebd3750e9767314
          persist-credentials: false
      - name: Verify pinned official source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFFICIAL_SOURCE_SHA"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify every package against its build manifest
        shell: bash
        run: GITHUB_REPOSITORY=tuziapi/tuzi-switch GITHUB_SHA="$OFFICIAL_SOURCE_SHA" python3 scripts/verify-release-assets.py release-assets
      - name: Prepare release notes and source
        shell: bash
        run: |
          git archive --format=tar.gz --output=release-assets/tuzi-assistant-source.tar.gz HEAD
          cp "docs/releases/${RELEASE_TAG}.md" release-assets/RELEASE-NOTES.md
          cat > release-assets/STAGING-NOTICE.txt <<'NOTICE'
          Official v1.6.1 source and embedded update channel: tuziapi/tuzi-switch.
          Source commit: 5950e9fc773d2092ed7a630a4ebd3750e9767314.
          Built on AiW520/tuzi-switch as an artifacts-only executor.
          Updater signatures are absent. These files are NOT publication-ready.
          Authorized unsigned manual delivery; final artifact and download checks remain required.
          No latest.json is provided and no Release or Pages deployment is performed.
          NOTICE
          cd release-assets
          sha256sum tuzi-assistant-* > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: official-unsigned-staging-v1.6.1
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
